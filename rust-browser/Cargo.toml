[package]
name = "ferrox-browser"
version = "0.2.0"
edition = "2021"
build = "build.rs"
authors = ["FerroX Contributors"]
description = "A lightweight, privacy-first desktop browser inspired by Opera GX, built in Rust with wry, tao, sysinfo, AES-GCM credential vaulting, DoH, and site isolation."
license = "MIT OR Apache-2.0"

[dependencies]
tao = "0.30"
wry = "0.47"
sysinfo = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
dirs = "5.0"
env_logger = "0.11"
log = "0.4"
aes-gcm = "0.10"
sha2 = "0.10"
keyring = "3.6"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
